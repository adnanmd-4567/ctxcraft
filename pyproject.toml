[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxcraft"
version = "0.1.0"
description = "A lightweight context engineering and token optimization toolkit."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]